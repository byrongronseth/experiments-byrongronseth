<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Experiments — Byron A. Gronseth</title>
  <meta name="description" content="A private archive of works in progress. Design-led, AI-assisted." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@200;300;400;500&family=JetBrains+Mono:wght@300;400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ink: '#0c0b09',
            'ink-2': '#100f0c',
            'ink-3': '#15140f',
            'ink-line': '#211f1a',
            'ink-line-2': '#2b2820',
            ash: '#5a564c',
            'ash-2': '#8a8473',
            bone: '#e8e3d6',
            gold: '#c9a84c',
            'gold-pale': '#e2c87f',
            'gold-dim': '#7a6431',
          },
          fontFamily: {
            display: ['"Inter Tight"', 'system-ui', 'sans-serif'],
            sans: ['"Inter Tight"', 'system-ui', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
            italic: ['"Instrument Serif"', 'serif'],
          },
          letterSpacing: {
            'razor': '0.32em',
            'wide-2': '0.22em',
          },
        }
      }
    }
  </script>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- Framer Motion UMD -->
  <script src="https://cdn.jsdelivr.net/npm/framer-motion@10.18.0/dist/framer-motion.js"></script>

  <!-- Lenis smooth scroll -->
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.20/dist/lenis.min.js"></script>

  <style>
    html, body {
      background: #0c0b09;
      color: #e8e3d6;
      font-family: 'Inter Tight', system-ui, sans-serif;
      font-weight: 300;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overscroll-behavior: none;
    }

    /* Lenis required */
    html.lenis, html.lenis body { height: auto; }
    .lenis.lenis-smooth { scroll-behavior: auto !important; }
    .lenis.lenis-smooth [data-lenis-prevent] { overscroll-behavior: contain; }
    .lenis.lenis-stopped { overflow: hidden; }
    .lenis.lenis-smooth iframe { pointer-events: none; }

    ::selection { background: #c9a84c; color: #0c0b09; }

    /* hide native cursor only on pointer-fine devices */
    @media (pointer: fine) {
      body.has-cursor, body.has-cursor * { cursor: none !important; }
    }

    /* Razor caps utility */
    .caps {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      font-weight: 400;
    }
    .caps-xs {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      font-weight: 400;
    }

    /* Display sizing */
    .display-xl {
      font-family: 'Inter Tight', sans-serif;
      font-weight: 200;
      font-size: clamp(56px, 11.4vw, 168px);
      line-height: 0.88;
      letter-spacing: -0.045em;
    }
    .display-lg {
      font-family: 'Inter Tight', sans-serif;
      font-weight: 200;
      font-size: clamp(48px, 8.4vw, 110px);
      line-height: 0.92;
      letter-spacing: -0.035em;
    }
    .display-md {
      font-family: 'Inter Tight', sans-serif;
      font-weight: 200;
      font-size: clamp(36px, 5.4vw, 72px);
      line-height: 0.96;
      letter-spacing: -0.025em;
    }

    .italic-serif {
      font-family: 'Instrument Serif', serif;
      font-style: italic;
      font-weight: 400;
    }

    /* Crosshair corner marker */
    .crosshair { position: relative; width: 7px; height: 7px; }
    .crosshair::before, .crosshair::after {
      content: ''; position: absolute; background: currentColor;
    }
    .crosshair::before { left: 50%; top: 0; bottom: 0; width: 1px; transform: translateX(-50%); }
    .crosshair::after  { top: 50%; left: 0; right: 0; height: 1px; transform: translateY(-50%); }

    /* Hairlines */
    .hair { height: 1px; background: #211f1a; width: 100%; }
    .hair-vert { width: 1px; background: #211f1a; }

    /* Faint dotted underline animation utility */
    .underline-grow {
      background-image: linear-gradient(currentColor, currentColor);
      background-size: 0% 1px;
      background-repeat: no-repeat;
      background-position: 0 100%;
      transition: background-size 600ms cubic-bezier(0.22, 1, 0.36, 1);
    }
    .group:hover .underline-grow,
    .underline-grow:hover { background-size: 100% 1px; }

    /* Subtle entry vignette to make hero feel like emerging from shadow */
    .hero-vignette {
      position: absolute; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse 80% 60% at 50% 50%, transparent 40%, #0c0b09 100%);
      mix-blend-mode: multiply;
    }

    /* Word-mask reveal */
    .reveal-mask { display: inline-block; overflow: hidden; vertical-align: top; }
    .reveal-inner { display: inline-block; will-change: transform; }

    /* Spinning gold rune in invitation */
    @keyframes slow-rotate { to { transform: rotate(360deg); } }
    .slow-rotate { animation: slow-rotate 80s linear infinite; }

    /* Inert input style */
    input[type="email"]:focus { outline: none; }

    /* Cursor */
    .cursor-dot, .cursor-ring {
      position: fixed; left: 0; top: 0; pointer-events: none; z-index: 9999;
      mix-blend-mode: difference;
    }
    .cursor-dot { width: 4px; height: 4px; background: #e8e3d6; border-radius: 999px; transform: translate(-50%, -50%); }
    .cursor-ring { width: 28px; height: 28px; border: 1px solid #e8e3d6; border-radius: 999px; transform: translate(-50%, -50%); transition: width 300ms, height 300ms, border-color 300ms; }
    .cursor-ring.large { width: 60px; height: 60px; border-color: #c9a84c; }
    .cursor-ring.dot-hide { opacity: 0; }

    /* Static glitch line — one scanline of disruption near edge */
    .glitch-bar {
      position: absolute; left: 0; right: 0; height: 1px; background: #c9a84c; opacity: 0.0;
      mix-blend-mode: screen;
    }

    /* Sparse list item border */
    .row-hover:hover .row-bg { transform: scaleX(1); }
    .row-bg {
      transform-origin: left;
      transform: scaleX(0);
      transition: transform 700ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* Make sure SVG accents render crisply */
    svg { shape-rendering: geometricPrecision; }

    /* Hide scrollbar but keep scrolling */
    body::-webkit-scrollbar { width: 0; height: 0; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-presets="env,react">
/* global React, FramerMotion */
const { motion, AnimatePresence, useScroll, useTransform, useMotionValue, useSpring, useInView } = window.FramerMotion || window.Motion;
const { useEffect, useRef, useState, useMemo, useLayoutEffect } = React;

/* ─────────────────────────── PRIMITIVES ─────────────────────────── */

// A small fixed crosshair + tick row pinned to the top of every section
const SectionMeta = ({ index, label, count, kicker }) => (
  <div className="flex items-baseline justify-between border-b border-ink-line pb-4 mb-12 sm:mb-20">
    <div className="flex items-center gap-3 sm:gap-5 text-gold">
      <span className="crosshair text-gold" />
      <span className="caps text-gold">{index}</span>
      <span className="caps text-bone/70">{label}</span>
    </div>
    <div className="flex items-center gap-3 sm:gap-5">
      {kicker && <span className="caps-xs text-ash hidden sm:inline">{kicker}</span>}
      <span className="caps-xs text-ash">{count}</span>
    </div>
  </div>
);

// Reveal one or more lines of large text from a clip mask
const RevealLines = ({ lines, delay = 0, className = '' }) => {
  return (
    <div className={className}>
      {lines.map((line, i) => (
        <div key={i} className="reveal-mask">
          <motion.div
            className="reveal-inner"
            initial={{ y: '110%' }}
            animate={{ y: '0%' }}
            transition={{
              duration: 1.4,
              ease: [0.22, 1, 0.36, 1],
              delay: delay + i * 0.12,
            }}
          >
            {line}
          </motion.div>
        </div>
      ))}
    </div>
  );
};

// Reveal a single span on view
const FadeUp = ({ children, delay = 0, y = 24, className = '', once = true }) => {
  const ref = useRef(null);
  const inView = useInView(ref, { once, margin: '0px 0px -10% 0px' });
  return (
    <motion.div
      ref={ref}
      initial={{ opacity: 0, y }}
      animate={inView ? { opacity: 1, y: 0 } : {}}
      transition={{ duration: 1.0, ease: [0.22, 1, 0.36, 1], delay }}
      className={className}
    >
      {children}
    </motion.div>
  );
};

// A horizontal hairline that draws in on view
const DrawHair = ({ delay = 0, className = '' }) => {
  const ref = useRef(null);
  const inView = useInView(ref, { once: true, margin: '0px 0px -20% 0px' });
  return (
    <motion.div
      ref={ref}
      className={`origin-left bg-ink-line h-px ${className}`}
      style={{ transformOrigin: 'left' }}
      initial={{ scaleX: 0 }}
      animate={inView ? { scaleX: 1 } : {}}
      transition={{ duration: 1.6, ease: [0.22, 1, 0.36, 1], delay }}
    />
  );
};

/* ─────────────────────────── CURSOR ─────────────────────────── */

const Cursor = () => {
  const x = useMotionValue(-100);
  const y = useMotionValue(-100);
  const sx = useSpring(x, { damping: 38, stiffness: 320, mass: 0.4 });
  const sy = useSpring(y, { damping: 38, stiffness: 320, mass: 0.4 });
  const [variant, setVariant] = useState('default');

  useEffect(() => {
    const move = (e) => {
      x.set(e.clientX);
      y.set(e.clientY);
    };
    const over = (e) => {
      const t = e.target.closest('[data-cursor]');
      if (t) setVariant(t.dataset.cursor); else setVariant('default');
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseover', over);
    document.body.classList.add('has-cursor');
    return () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseover', over);
      document.body.classList.remove('has-cursor');
    };
  }, []);

  return (
    <div className="pointer-events-none">
      <motion.div className="cursor-dot" style={{ x, y }} />
      <motion.div
        className={`cursor-ring ${variant === 'large' ? 'large' : ''}`}
        style={{ x: sx, y: sy }}
      />
    </div>
  );
};

/* ─────────────────────────── NAV ─────────────────────────── */

const TopNav = () => (
  <motion.header
    className="fixed top-0 left-0 right-0 z-40 px-6 sm:px-10 py-6 flex items-center justify-between mix-blend-difference"
    initial={{ opacity: 0, y: -10 }}
    animate={{ opacity: 1, y: 0 }}
    transition={{ duration: 1.2, delay: 0.6, ease: [0.22, 1, 0.36, 1] }}
  >
    <div className="flex items-center gap-3">
      <span className="block w-2 h-2 rounded-full bg-gold" />
      <span className="caps text-bone">B · G</span>
    </div>
    <nav className="hidden sm:flex items-center gap-8">
      <a href="#works"      data-cursor="large" className="caps text-bone/70 hover:text-bone transition-colors duration-300">Works</a>
      <a href="#bench"      data-cursor="large" className="caps text-bone/70 hover:text-bone transition-colors duration-300">Bench</a>
      <a href="#provenance" data-cursor="large" className="caps text-bone/70 hover:text-bone transition-colors duration-300">Provenance</a>
      <a href="#invitation" data-cursor="large" className="caps text-bone/70 hover:text-bone transition-colors duration-300">Invitation</a>
    </nav>
    <div className="flex items-center gap-3">
      <span className="caps-xs text-ash hidden sm:block">MMXXVI · VOL · I</span>
      <a href="https://byrongronseth.com" data-cursor="large" className="caps text-bone/70 hover:text-bone transition-colors duration-300">↩ Portfolio</a>
    </div>
  </motion.header>
);

/* ─────────────────────────── HERO ─────────────────────────── */

const Hero = () => {
  const ref = useRef(null);
  const { scrollYProgress } = useScroll({ target: ref, offset: ['start start', 'end start'] });
  const heroY = useTransform(scrollYProgress, [0, 1], [0, 180]);
  const heroOpacity = useTransform(scrollYProgress, [0, 0.8], [1, 0]);
  const titleScale = useTransform(scrollYProgress, [0, 1], [1, 0.96]);

  // live clock
  const [time, setTime] = useState('');
  useEffect(() => {
    const tick = () => {
      const d = new Date();
      const hh = String(d.getUTCHours()).padStart(2, '0');
      const mm = String(d.getUTCMinutes()).padStart(2, '0');
      const ss = String(d.getUTCSeconds()).padStart(2, '0');
      setTime(`${hh}:${mm}:${ss} UTC`);
    };
    tick();
    const id = setInterval(tick, 1000);
    return () => clearInterval(id);
  }, []);

  return (
    <section ref={ref} className="relative min-h-screen pt-28 pb-16 px-6 sm:px-10 flex flex-col justify-between overflow-hidden">
      {/* Corner brackets — subtle cyberpunk frame */}
      <CornerBracket pos="tl" />
      <CornerBracket pos="tr" />
      <CornerBracket pos="bl" />
      <CornerBracket pos="br" />

      {/* Top meta row */}
      <motion.div
        className="flex items-baseline justify-between"
        initial={{ opacity: 0 }}
        animate={{ opacity: 1 }}
        transition={{ duration: 1.6, delay: 0.1 }}
      >
        <div className="flex items-center gap-4">
          <span className="crosshair text-gold" />
          <span className="caps text-bone/60">experiments · private archive</span>
        </div>
        <div className="flex items-center gap-4">
          <span className="caps-xs text-ash">{time}</span>
        </div>
      </motion.div>

      {/* Title block */}
      <motion.div style={{ y: heroY, opacity: heroOpacity, scale: titleScale }} className="my-12 sm:my-16">
        <div className="flex items-center gap-3 mb-8 sm:mb-12">
          <FadeUp delay={0.2}><span className="caps text-gold">№ 001 — Volume One</span></FadeUp>
        </div>

        <h1 className="display-xl text-bone">
          <RevealLines lines={['Experiments.']} delay={0.4} />
        </h1>

        <div className="mt-10 sm:mt-14 grid grid-cols-12 gap-6">
          <div className="col-span-12 md:col-span-5">
            <FadeUp delay={1.0} className="text-bone/70 text-base sm:text-lg leading-relaxed font-light">
              A private archive of <span className="italic-serif text-gold">works in progress</span> —
              prototypes, agents, and small machines built in the open. Design-led.
              AI-assisted. Quiet by design.
            </FadeUp>
          </div>
          <div className="hidden md:block md:col-span-2" />
          <div className="col-span-12 md:col-span-5 flex md:justify-end items-end">
            <FadeUp delay={1.2}>
              <div className="space-y-2 text-right">
                <div className="caps-xs text-ash">Curated by</div>
                <div className="italic-serif text-bone text-2xl">Byron A. Gronseth</div>
                <div className="caps-xs text-ash">experiments.byrongronseth.com</div>
              </div>
            </FadeUp>
          </div>
        </div>
      </motion.div>

      {/* Bottom strip — status line */}
      <motion.div
        className="flex items-end justify-between gap-6 pt-10 border-t border-ink-line"
        initial={{ opacity: 0, y: 16 }}
        animate={{ opacity: 1, y: 0 }}
        transition={{ duration: 1.2, delay: 1.4, ease: [0.22, 1, 0.36, 1] }}
      >
        <div className="grid grid-cols-2 md:grid-cols-4 gap-6 sm:gap-10 flex-1">
          <Stat label="Active works"  value="04" />
          <Stat label="On the bench"  value="04" />
          <Stat label="Established"   value="MMXX" />
          <Stat label="Index" value="EXP-26-I" />
        </div>
        <a href="#works" data-cursor="large" className="hidden md:flex items-center gap-3 caps text-bone/60 hover:text-gold transition-colors duration-500">
          <span>Enter</span>
          <ScrollArrow />
        </a>
      </motion.div>
    </section>
  );
};

const Stat = ({ label, value }) => (
  <div className="flex flex-col gap-1.5">
    <span className="caps-xs text-ash">{label}</span>
    <span className="font-mono text-bone text-sm tracking-wider">{value}</span>
  </div>
);

const CornerBracket = ({ pos }) => {
  const map = {
    tl: 'top-3 left-3 border-t border-l',
    tr: 'top-3 right-3 border-t border-r',
    bl: 'bottom-3 left-3 border-b border-l',
    br: 'bottom-3 right-3 border-b border-r',
  };
  return <span className={`absolute w-3.5 h-3.5 border-gold/50 ${map[pos]}`} />;
};

const ScrollArrow = () => (
  <motion.div
    initial={{ y: 0 }}
    animate={{ y: [0, 4, 0] }}
    transition={{ duration: 2.4, repeat: Infinity, ease: 'easeInOut' }}
    className="w-px h-7 bg-gold/60 relative"
  >
    <span className="absolute -bottom-1 -left-1 w-2 h-2 border-b border-r border-gold/60 rotate-45" />
  </motion.div>
);

/* Components for later sections live below */

/* ─────────────────────────── WORK CARD ─────────────────────────── */

const WorkCard = ({ project, index }) => {
  const ref = useRef(null);
  const inView = useInView(ref, { once: true, margin: '0px 0px -15% 0px' });
  const [hover, setHover] = useState(false);

  return (
    <motion.a
      ref={ref}
      href={project.url}
      target="_blank"
      rel="noopener noreferrer"
      data-cursor="large"
      className="group block relative border-t border-ink-line py-10 sm:py-14"
      onMouseEnter={() => setHover(true)}
      onMouseLeave={() => setHover(false)}
      initial={{ opacity: 0, y: 40 }}
      animate={inView ? { opacity: 1, y: 0 } : {}}
      transition={{ duration: 1.2, ease: [0.22, 1, 0.36, 1], delay: index * 0.15 }}
    >
      {/* Reveal stripe on hover */}
      <motion.span
        aria-hidden
        className="absolute left-0 top-0 h-px bg-gold"
        initial={{ width: '0%' }}
        animate={{ width: hover ? '100%' : '0%' }}
        transition={{ duration: 0.9, ease: [0.22, 1, 0.36, 1] }}
      />

      <div className="grid grid-cols-12 gap-6 items-start">
        {/* Index + status */}
        <div className="col-span-12 md:col-span-2 flex md:flex-col gap-4 md:gap-3">
          <span className="caps-xs text-ash">{project.num}</span>
          <span className={`caps-xs ${project.status === 'Active' ? 'text-gold' : 'text-bone/70'}`}>
            ● {project.status}
          </span>
        </div>

        {/* Title + body */}
        <div className="col-span-12 md:col-span-6">
          <motion.h3
            className="display-md text-bone leading-[0.96]"
            animate={{ x: hover ? 8 : 0 }}
            transition={{ duration: 0.8, ease: [0.22, 1, 0.36, 1] }}
          >
            {project.name}<span className="text-gold">.</span>
          </motion.h3>
          <p className="mt-4 sm:mt-6 max-w-md text-bone/65 text-sm sm:text-base leading-relaxed">
            {project.desc}
          </p>
          <div className="mt-5 flex flex-wrap gap-x-5 gap-y-2">
            {project.tags.map((t, ti) => (
              <span key={`${t}-${ti}`} className="caps-xs text-ash">— {t}</span>
            ))}
          </div>
        </div>

        {/* Visual sigil */}
        <div className="col-span-12 md:col-span-4 flex md:justify-end">
          <ProjectSigil kind={project.sigil} hover={hover} />
        </div>
      </div>

      {/* URL row */}
      <div className="mt-8 md:mt-10 flex items-center justify-between gap-6">
        <div className="caps-xs text-ash truncate">
          <span className="text-gold">↗ </span>{project.urlLabel}
        </div>
        <div className="flex items-center gap-3">
          <span className="caps-xs text-bone/60 group-hover:text-gold transition-colors duration-500">Enter</span>
          <motion.span
            className="block w-8 h-px bg-bone/60 group-hover:bg-gold"
            animate={{ scaleX: hover ? 1.6 : 1 }}
            style={{ transformOrigin: 'left' }}
            transition={{ duration: 0.6, ease: [0.22, 1, 0.36, 1] }}
          />
        </div>
      </div>
    </motion.a>
  );
};

const ProjectSigil = ({ kind, hover }) => {
  // Geometric monoline emblem — gold strokes on black
  const size = 140;
  return (
    <motion.div
      className="relative"
      style={{ width: size, height: size }}
      animate={{ rotate: hover ? 90 : 0 }}
      transition={{ duration: 1.4, ease: [0.22, 1, 0.36, 1] }}
    >
      <svg viewBox="0 0 140 140" className="w-full h-full">
        {/* Corner tick marks */}
        <g stroke="#211f1a" strokeWidth="1" fill="none">
          <path d="M0 8 L0 0 L8 0" />
          <path d="M140 8 L140 0 L132 0" />
          <path d="M0 132 L0 140 L8 140" />
          <path d="M140 132 L140 140 L132 140" />
        </g>
        {kind === 'circle' && (
          <g fill="none" stroke="#c9a84c" strokeWidth="0.8">
            <circle cx="70" cy="70" r="48" />
            <circle cx="70" cy="70" r="32" opacity="0.5" />
            <circle cx="70" cy="70" r="16" opacity="0.25" />
            <line x1="70" y1="14" x2="70" y2="126" opacity="0.4" />
            <line x1="14" y1="70" x2="126" y2="70" opacity="0.4" />
          </g>
        )}
        {kind === 'square' && (
          <g fill="none" stroke="#c9a84c" strokeWidth="0.8">
            <rect x="22" y="22" width="96" height="96" />
            <rect x="38" y="38" width="64" height="64" opacity="0.5" />
            <rect x="54" y="54" width="32" height="32" opacity="0.25" />
            <line x1="22" y1="22" x2="118" y2="118" opacity="0.4" />
            <line x1="118" y1="22" x2="22" y2="118" opacity="0.4" />
          </g>
        )}
        {kind === 'triangle' && (
          <g fill="none" stroke="#c9a84c" strokeWidth="0.8">

/* ─────────────────────────── ROOT ─────────────────────────── */

const App = () => {
  // Init Lenis with heavy momentum
  useEff(() => {
    if (typeof Lenis === 'undefined') return;
    const lenis = new Lenis({
      duration: 1.8,
      easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)),
      smoothWheel: true,
      wheelMultiplier: 0.9,
      touchMultiplier: 1.6,
    });
    let raf;
    const loop = (time) => {
      lenis.raf(time);
      raf = requestAnimationFrame(loop);
    };
    raf = requestAnimationFrame(loop);

    // Handle anchor links via Lenis for buttery jumps
    const onClick = (e) => {
      const a = e.target.closest('a[href^="#"]');
      if (!a) return;
      const id = a.getAttribute('href');
      if (!id || id.length < 2) return;
      const el = document.querySelector(id);
      if (!el) return;
      e.preventDefault();
      lenis.scrollTo(el, { duration: 2.2, easing: (t) => 1 - Math.pow(1 - t, 4) });
    };
    document.addEventListener('click', onClick);

    return () => {
      cancelAnimationFrame(raf);
      lenis.destroy();
      document.removeEventListener('click', onClick);
    };
  }, []);

  return (
    <div className="relative bg-ink min-h-screen overflow-hidden">
      <Cursor />
      <ScrollRail />
      <SideRail />
      <TopNav />
      <main>
        <Hero />
        <Works />

        <Invitation />
      </main>
      <Foot />
    </div>
  );
};
