    html, body {

    /* ── Tweakable palette ──
       Default mood: Nightfall (gold).
       Overrides below for Steel and Ember swap the CSS vars so every
       text-gold / bg-gold / border-gold class (and SVG stroke="#c9a84c"
       wireframe accent) shifts together. */
    :root {
      --c-gold-rgb:      201 168 76;
      --c-gold-pale-rgb: 226 200 127;
      --c-gold-dim-rgb:  122 100 49;
      /* Channel color used in chromatic-split text-shadow on the glitch keyframes —

      --c-channel: 140 200 255;
      /* Display type — tweakable */
      --display-family: 'Cormorant Garamond', 'EB Garamond', Garamond, serif;
      --display-weight: 300;
      --display-tracking: -0.025em;
      --display-tracking-tight: -0.035em;
      --display-tracking-xl: -0.04em;
      --display-italic-family: 'Cormorant Garamond', 'EB Garamond', Garamond, serif;
    }
    body[data-font="EB Garamond"] {
      --display-family: 'EB Garamond', Garamond, serif;
      --display-weight: 400;
      --display-tracking: -0.022em;
      --display-tracking-tight: -0.028em;
      --display-tracking-xl: -0.03em;
      --display-italic-family: 'EB Garamond', Garamond, serif;
    }
    body[data-font="Italiana"] {
      --display-family: 'Italiana', 'Cormorant Garamond', serif;
      --display-weight: 400;
      --display-tracking: -0.01em;
      --display-tracking-tight: -0.012em;
      --display-tracking-xl: -0.015em;
      --display-italic-family: 'Italiana', serif;
    }
    body[data-font="Inter Tight"] {
      --display-family: 'Inter Tight', system-ui, sans-serif;
      --display-weight: 200;
      --display-tracking: -0.025em;
      --display-tracking-tight: -0.035em;
      --display-tracking-xl: -0.045em;
      --display-italic-family: 'Instrument Serif', serif;
    }
    body[data-mood="steel"] {
      --c-gold-rgb:      184 200 215;   /* cool silver */
      --c-gold-pale-rgb: 212 224 234;
      --c-gold-dim-rgb:  102 116 130;
      --c-channel:       255 168 140;   /* warm contrast against cool */
    }
    body[data-mood="ember"] {
      --c-gold-rgb:      217 119 87;    /* copper / oxblood */
      --c-gold-pale-rgb: 232 153 128;
      --c-gold-dim-rgb:  138 61 36;
      --c-channel:       120 220 255;   /* cool contrast against warm */
    }
    /* Sweep all hardcoded SVG accent strokes/fills (wireframes, sigils) along
       with the palette without touching every component. */
    svg [stroke="#c9a84c"] { stroke: rgb(var(--c-gold-rgb)) !important; }
    svg [fill="#c9a84c"]   { fill:   rgb(var(--c-gold-rgb)) !important; }

    /* Lenis required */
    html.lenis, html.lenis body { height: auto; }
    .lenis.lenis-smooth { scroll-behavior: auto !important; }
    .lenis.lenis-smooth [data-lenis-prevent] { overscroll-behavior: contain; }
    .lenis.lenis-stopped { overflow: hidden; }
    .lenis.lenis-smooth iframe { pointer-events: none; }

    ::selection { background: rgb(var(--c-gold-rgb)); color: #0c0b09; }

    /* hide native cursor only on pointer-fine devices */
    @media (pointer: fine) {
      body.has-cursor, body.has-cursor * { cursor: none !important; }
    }

    /* Razor caps utility */
    .caps {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      font-weight: 400;
    }
    .caps-xs {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      font-weight: 400;
    }

    /* Display sizing */
    .display-xl {
      font-family: var(--display-family);
      font-weight: var(--display-weight);
      font-size: clamp(56px, 10vw, 140px);
      line-height: 0.88;
      letter-spacing: var(--display-tracking-xl);
    }
    .display-lg {
      font-family: var(--display-family);
      font-weight: var(--display-weight);
      font-size: clamp(48px, 8.4vw, 110px);
      line-height: 0.94;
      letter-spacing: var(--display-tracking-tight);
    }
    .display-md {
      font-family: var(--display-family);
      font-weight: var(--display-weight);
      font-size: clamp(36px, 5.4vw, 72px);
      line-height: 1.0;
      letter-spacing: var(--display-tracking);
    }
    /* Bench row titles + tools headline use the same serif family for cohesion */
    .display-sm {
      font-family: var(--display-family);
      font-weight: var(--display-weight);
      letter-spacing: var(--display-tracking);
    }

    .italic-serif {
      font-family: var(--display-italic-family);
      font-style: italic;
      font-weight: var(--display-weight);
    }

    /* Crosshair corner marker */
    .crosshair { position: relative; width: 7px; height: 7px; }
    .crosshair::before, .crosshair::after {
      content: ''; position: absolute; background: currentColor;
    }
    .crosshair::before { left: 50%; top: 0; bottom: 0; width: 1px; transform: translateX(-50%); }
    .crosshair::after  { top: 50%; left: 0; right: 0; height: 1px; transform: translateY(-50%); }

    /* Hairlines */
    .hair { height: 1px; background: #211f1a; width: 100%; }
    .hair-vert { width: 1px; background: #211f1a; }

    /* Faint dotted underline animation utility */
    .underline-grow {
      background-image: linear-gradient(currentColor, currentColor);
      background-size: 0% 1px;
      background-repeat: no-repeat;
      background-position: 0 100%;
      transition: background-size 600ms cubic-bezier(0.22, 1, 0.36, 1);
    }
    .group:hover .underline-grow,
    .underline-grow:hover { background-size: 100% 1px; }

    /* Subtle entry vignette to make hero feel like emerging from shadow */
    .hero-vignette {
      position: absolute; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse 80% 60% at 50% 50%, transparent 40%, #0c0b09 100%);
      mix-blend-mode: multiply;
    }

    /* Word-mask reveal */
    .reveal-mask { display: inline-block; overflow: hidden; vertical-align: top; }
    .reveal-inner { display: inline-block; will-change: transform; }

    /* Spinning gold rune in invitation */
    @keyframes slow-rotate { to { transform: rotate(360deg); } }
    .slow-rotate { animation: slow-rotate 80s linear infinite; }

    /* Inert input style */
    input[type="email"]:focus { outline: none; }

    /* Cursor */
    .cursor-dot, .cursor-ring {
      position: fixed; left: 0; top: 0; pointer-events: none; z-index: 9999;
      mix-blend-mode: difference;
    }
    .cursor-dot { width: 4px; height: 4px; background: #e8e3d6; border-radius: 999px; transform: translate(-50%, -50%); }
    .cursor-ring { width: 28px; height: 28px; border: 1px solid #e8e3d6; border-radius: 999px; transform: translate(-50%, -50%); transition: width 300ms, height 300ms, border-color 300ms; }
    .cursor-ring.large { width: 60px; height: 60px; border-color: rgb(var(--c-gold-rgb)); }
    .cursor-ring.magnetized { width: 44px; height: 44px; border-color: rgb(var(--c-gold-rgb)); }
    .cursor-ring.large.magnetized { width: 72px; height: 72px; }
    .cursor-ring.dot-hide { opacity: 0; }

    /* Static glitch line — one scanline of disruption near edge */
    .glitch-bar {
      position: absolute; left: 0; right: 0; height: 1px; background: #c9a84c; opacity: 0.0;
      mix-blend-mode: screen;
    }

    /* Sparse list item border */
    .row-hover:hover .row-bg { transform: scaleX(1); }
    .row-bg {
      transform-origin: left;
      transform: scaleX(0);
      transition: transform 700ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* Make sure SVG accents render crisply */
    svg { shape-rendering: geometricPrecision; }

    /* Hide scrollbar but keep scrolling */
    body::-webkit-scrollbar { width: 0; height: 0; }

    /* Footer ticker marquee */
    @keyframes ticker-marquee {
      from { transform: translate3d(0, 0, 0); }
      to   { transform: translate3d(-50%, 0, 0); }
    }
    .ticker-track {
      display: flex;
      width: max-content;
      animation: ticker-marquee 90s linear infinite;
      will-change: transform;
    }
    .ticker-track:hover { animation-play-state: paused; }
    @media (prefers-reduced-motion: reduce) {
      .ticker-track { animation: none !important; }
    }

    /* ── Glitch system ── */

    /* Hover triple-flicker (180ms) — fires once on hover
       Each "off" beat sears a gold glow into the type. */
    @keyframes glitch-flicker {
      0%      { opacity: 1;    text-shadow: 0 0 0 transparent; transform: translate3d(0,0,0); }
      16.66%  { opacity: 0.55; text-shadow:
                  1px 0 0 rgb(var(--c-gold-rgb)),
                  -1px 0 0 rgb(var(--c-channel) / 0.55),
                  0 0 6px rgb(var(--c-gold-rgb) / 0.85),
                  0 0 18px rgb(var(--c-gold-rgb) / 0.45);
                transform: translate3d(-0.4px,0,0); }
      33.33%  { opacity: 1;    text-shadow:
                  0 0 4px rgb(var(--c-gold-rgb) / 0.35);
                transform: translate3d(0,0,0); }
      50%     { opacity: 0.45; text-shadow:
                  -1.4px 0 0 rgb(var(--c-gold-rgb)),
                  1.4px 0 0 rgb(var(--c-channel) / 0.55),
                  0 0 8px rgb(var(--c-gold-rgb) / 0.95),
                  0 0 22px rgb(var(--c-gold-rgb) / 0.55),
                  0 0 36px rgb(var(--c-gold-rgb) / 0.25);
                transform: translate3d(0.6px,0,0); }
      66.66%  { opacity: 1;    text-shadow:
                  0 0 5px rgb(var(--c-gold-rgb) / 0.4);
                transform: translate3d(0,0,0); }
      83.33%  { opacity: 0.7;  text-shadow:
                  0.8px 0 0 rgb(var(--c-gold-rgb)),
                  -0.8px 0 0 rgb(var(--c-channel) / 0.35),
                  0 0 7px rgb(var(--c-gold-rgb) / 0.7),
                  0 0 18px rgb(var(--c-gold-rgb) / 0.35);
                transform: translate3d(-0.2px,0,0); }
      100%    { opacity: 1;    text-shadow: 0 0 0 transparent; transform: translate3d(0,0,0); }
    }
    .glitch-flicker {
      transition: text-shadow 700ms cubic-bezier(0.22, 1, 0.36, 1);
    }
    .glitch-flicker:hover {
      animation: glitch-flicker 0.18s steps(6, jump-end) 1;
      /* Residual burn that lingers after the flicker completes —
         on mouse-leave this fades out via the transition above,
         "bleeding" the gold off the edges. */
      text-shadow:
        0 0 6px rgb(var(--c-gold-rgb) / 0.55),
        0 0 18px rgb(var(--c-gold-rgb) / 0.30),
        0 0 38px rgb(var(--c-gold-rgb) / 0.14);
    }

    /* One-shot chromatic entry split (~520ms) with a sustained gold burn
       that fades the longest — the "afterglow" reads as light, not noise. */
    @keyframes glitch-entry {
      0%   { text-shadow: 0 0 0 transparent; transform: translate3d(0,0,0); }
      18%  { text-shadow:
               2px 0 0 rgb(var(--c-gold-rgb)),
               -2px 0 0 rgb(var(--c-channel) / 0.6),
               0 0 10px rgb(var(--c-gold-rgb) / 0.85),
               0 0 28px rgb(var(--c-gold-rgb) / 0.55);
             transform: translate3d(-1.2px,0,0); }
      38%  { text-shadow:
               -2.6px 0 0 rgb(var(--c-gold-rgb)),
               2.6px 0 0 rgb(var(--c-channel) / 0.6),
               0 0 14px rgb(var(--c-gold-rgb) / 0.95),
               0 0 36px rgb(var(--c-gold-rgb) / 0.6),
               0 0 60px rgb(var(--c-gold-rgb) / 0.25);
             transform: translate3d(1.4px,0,0); }
      58%  { text-shadow:
               1.4px 0 0 rgb(var(--c-gold-rgb)),
               -1.4px 0 0 rgb(var(--c-channel) / 0.45),
               0 0 12px rgb(var(--c-gold-rgb) / 0.7),
               0 0 30px rgb(var(--c-gold-rgb) / 0.4);
             transform: translate3d(-0.6px,0,0); }
      78%  { text-shadow:
               -0.7px 0 0 rgb(var(--c-gold-rgb)),
               0.7px 0 0 rgb(var(--c-channel) / 0.3),
               0 0 8px rgb(var(--c-gold-rgb) / 0.45),
               0 0 22px rgb(var(--c-gold-rgb) / 0.22);
             transform: translate3d(0.3px,0,0); }
      100% { text-shadow: 0 0 0 transparent; transform: translate3d(0,0,0); }

      animation: glitch-entry 0.62s cubic-bezier(0.22, 1, 0.36, 1) 1;
    }

    /* Ambient scanline sweep — full-page, runs occasionally */
    @keyframes scan-sweep {
      0%   { transform: translate3d(0,-12vh,0); opacity: 0; }
      8%   { opacity: 0.7; }
      92%  { opacity: 0.6; }
      100% { transform: translate3d(0,110vh,0); opacity: 0; }
    }
    .scanline {
      position: fixed; left: 0; right: 0; top: 0; height: 1px;
      background: linear-gradient(90deg, transparent 0%, rgb(var(--c-gold-rgb) / 0) 8%, rgb(var(--c-gold-rgb) / 0.6) 50%, rgb(var(--c-gold-rgb) / 0) 92%, transparent 100%);

      box-shadow: 0 0 12px rgb(var(--c-gold-rgb) / 0.35);
    }
    .scanline.run { animation: scan-sweep 2.6s cubic-bezier(0.22, 1, 0.36, 1); }

    /* Scramble char styling — gold while still scrambling */
    .scrambling { color: rgb(var(--c-gold-rgb)); }

    /* Preview tile container */
    .preview-tile {
      position: relative;
      width: 280px; max-width: 100%;
      aspect-ratio: 4 / 3;
      background: #0c0b09;
      border: 1px solid #211f1a;
      overflow: hidden;
      transition: border-color 600ms cubic-bezier(0.22, 1, 0.36, 1);
    }
    .preview-tile.is-hover { border-color: rgb(var(--c-gold-rgb)); }

    /* Preview corner brackets */
    .preview-tile .br-tl, .preview-tile .br-tr,
    .preview-tile .br-bl, .preview-tile .br-br {
      position: absolute; width: 10px; height: 10px;
      border-color: rgb(var(--c-gold-rgb)); pointer-events: none;
      opacity: 0; transition: opacity 500ms;
    }
    .preview-tile.is-hover .br-tl,
    .preview-tile.is-hover .br-tr,
    .preview-tile.is-hover .br-bl,
    .preview-tile.is-hover .br-br { opacity: 1; }
    .preview-tile .br-tl { top: 4px; left: 4px; border-top: 1px solid; border-left: 1px solid; }
    .preview-tile .br-tr { top: 4px; right: 4px; border-top: 1px solid; border-right: 1px solid; }
    .preview-tile .br-bl { bottom: 4px; left: 4px; border-bottom: 1px solid; border-left: 1px solid; }
    .preview-tile .br-br { bottom: 4px; right: 4px; border-bottom: 1px solid; border-right: 1px solid; }

    /* Internal preview scanline */
    @keyframes preview-scan {
      0%   { transform: translateY(-10%); opacity: 0; }
      20%  { opacity: 1; }
      80%  { opacity: 1; }
      100% { transform: translateY(110%); opacity: 0; }
    }
    .preview-scanline {
      position: absolute; left: 0; right: 0; top: 0; height: 24px;
      background: linear-gradient(180deg, rgb(var(--c-gold-rgb) / 0) 0%, rgb(var(--c-gold-rgb) / 0.12) 50%, rgb(var(--c-gold-rgb) / 0) 100%);
      pointer-events: none;
      animation: preview-scan 3.2s linear infinite;
      animation-play-state: paused;
    }
    .preview-tile.is-hover .preview-scanline { animation-play-state: running; }

    /* Status dot pulse */
    @keyframes status-pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.25; }
    }
    .pulse { animation: status-pulse 1.6s ease-in-out infinite; }

    /* Typing cursor */
    @keyframes type-blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    .type-cursor { animation: type-blink 0.9s steps(2) infinite; }
  </style>
