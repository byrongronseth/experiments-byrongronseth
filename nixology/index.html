<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nixology — Zero-proof spirits, summoned.</title>
  <meta name="description" content="A dark, celestial cellar for the sober-curious. Discover, rate, and remember every zero-proof pour with Nixology." />
  <meta property="og:title" content="Nixology — Zero-proof spirits, summoned." />
  <meta property="og:description" content="A grimoire for the new pour. Phony negronis, hop water, zero-proof aperitifs — kept beside the friends who actually drink them." />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Nunito:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />

  <!-- Tailwind — precompiled ahead of time -->
  <link rel="stylesheet" href="/nixology/tailwind.css" />

  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" crossorigin="anonymous"></script>

  <style>
    :root {
      --background: oklch(0.13 0.025 295);
      --foreground: oklch(0.96 0.01 290);
      --card: oklch(0.18 0.03 295);
      --border: oklch(0.26 0.025 295);

      --font-serif: 'EB Garamond', ui-serif, Georgia, serif;
      --font-sans: 'Nunito', ui-sans-serif, system-ui, sans-serif;
      --font-mono: 'Space Mono', ui-monospace, SFMono-Regular, Menlo, monospace;

      --glass-bg: oklch(0.18 0.03 295 / 0.55);
      --glass-border: oklch(0.5 0.1 300 / 0.18);
      --shadow-glow: 0 0 60px -10px oklch(0.55 0.21 320 / 0.45);
      --shadow-card: 0 24px 60px -24px oklch(0.05 0.02 290 / 0.8);
    }

    * { border-color: var(--border); box-sizing: border-box; }

    html {
      background-color: var(--background);
      color: var(--foreground);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      margin: 0;
      background-color: var(--background);
      color: var(--foreground);
      overflow-x: hidden;
    }

    h1, h2, h3, p { margin: 0; }

    ::selection {
      background: oklch(0.55 0.21 320 / 0.4);
      color: oklch(0.99 0 0);
    }

    /* === Components === */
    .glass-card {
      background: var(--glass-bg);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--glass-border);
      box-shadow: var(--shadow-card);
    }

    .text-gradient-purple {
      background: linear-gradient(135deg, oklch(0.85 0.12 320), oklch(0.6 0.22 320));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
    }

    .glow-purple {
      box-shadow: 0 0 40px -8px oklch(0.55 0.21 320 / 0.55);
    }

    .label-mono {
      font-family: var(--font-mono);
      text-transform: uppercase;
      letter-spacing: 0.22em;
      font-size: 0.7rem;
      color: oklch(0.7 0.05 290);
    }

    /* === Scroll deck === */
    .deck {
      height: 100dvh;
      overflow-y: auto;
      scroll-snap-type: y mandatory;
      scroll-behavior: smooth;
      scrollbar-width: none;
    }
    .deck::-webkit-scrollbar { display: none; }

    .slide {
      scroll-snap-align: start;
      scroll-snap-stop: always;
      min-height: 100dvh;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 5rem 1.5rem;
      overflow: hidden;
    }

    /* === Reveals === */
    .reveal {
      opacity: 0;
      transform: translateY(28px);
      transition: opacity 1s cubic-bezier(.2,.7,.2,1), transform 1s cubic-bezier(.2,.7,.2,1);
    }
    .reveal.in {
      opacity: 1;
      transform: translateY(0);
    }
    .reveal-delay-1 { transition-delay: .1s; }
    .reveal-delay-2 { transition-delay: .25s; }
    .reveal-delay-3 { transition-delay: .4s; }
    .reveal-delay-4 { transition-delay: .55s; }

    /* === Animations === */
    @keyframes smoke-bloom {
      0%   { transform: translate(-50%, -50%) scale(0.6); opacity: 0; }
      40%  { opacity: 0.7; }
      100% { transform: translate(-50%, -50%) scale(1.6); opacity: 0; }
    }
    @keyframes glow-pulse {
      0%, 100% { opacity: 0.5; transform: scale(1); }
      50%      { opacity: 0.9; transform: scale(1.05); }
    }
    @keyframes drift {
      0%, 100% { transform: translate(0, 0); }
      50%      { transform: translate(8px, -10px); }
    }
    @keyframes drift-slow {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      50%      { transform: translate(-12px, 8px) rotate(3deg); }
    }
    @keyframes marquee {
      from { transform: translateX(0); }
      to   { transform: translateX(-50%); }
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.2; }
      50%      { opacity: 1; }
    }
    @keyframes scroll-cue {
      0%   { transform: translateY(0); opacity: 0.8; }
      100% { transform: translateY(10px); opacity: 0; }
    }
    @keyframes flicker {
      0%, 100% { opacity: 0.55; }
      43%      { opacity: 0.75; }
      46%      { opacity: 0.4; }
      49%      { opacity: 0.7; }
    }
    @keyframes fadeUpCard {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .animate-glow-pulse { animation: glow-pulse 6s ease-in-out infinite; }
    .animate-drift { animation: drift 9s ease-in-out infinite; }
    .animate-drift-slow { animation: drift-slow 14s ease-in-out infinite; }
    .animate-marquee { animation: marquee 60s linear infinite; }
    .animate-twinkle { animation: twinkle 4s ease-in-out infinite; }
    .animate-flicker { animation: flicker 5s ease-in-out infinite; }

    @media (prefers-reduced-motion: reduce) {
      .reveal { opacity: 1; transform: none; transition: none; }
      .animate-glow-pulse, .animate-drift, .animate-drift-slow,
      .animate-marquee, .animate-twinkle, .animate-flicker { animation: none; }
      .deck { scroll-behavior: auto; }
    }
  </style>
</head>

  const Starfield = ({ count = 90, className }) => {

  }));

  /* ─────────────────────────── SCROLL DECK ─────────────────────────── */

  const ScrollDeck = ({ slides }) => {
    const containerRef = useRef(null);
    const sectionRefs = useRef([]);
    const [active, setActive] = useState(0);

    useEffect(() => {
      const observer = new IntersectionObserver((entries) => {
        entries.forEach((e) => {
          const idx = Number(e.target.dataset.index);
          if (e.isIntersecting && e.intersectionRatio >= 0.55) {

          if (e.isIntersecting) {

    useEffect(() => {

          next = Math.max(0, active - 1);
        } else if (e.key === 'Home') {
          e.preventDefault();
          next = 0;
        } else if (e.key === 'End') {
          e.preventDefault();
          next = slides.length - 1;
        } else {
          return;
        }
        jump(next);
      };
      window.addEventListener('keydown', onKey);
      return () => window.removeEventListener('keydown', onKey);
    }, [active, slides.length]);

      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });

        href: '#slide-cta',

          e.currentTarget.style.color = 'white';
          e.currentTarget.style.padding = '0.5rem 1rem';

        onBlur: (e) => { e.currentTarget.style.left = '-9999px'; }

      React.createElement('div', { ref: containerRef, className: 'deck' },

          ref: (el) => { sectionRefs.current[i] = el; },

      React.createElement(SideNav, {
        slides: slides.map((s) => ({ id: s.id, label: s.label })),
        active: active,
        onJump: jump
      })

  };

  /* ─────────────────────────── HERO SLIDE ─────────────────────────── */

  const HeroSlide = () => React.createElement(React.Fragment, null,

      React.createElement('h1', {
        id: 'heading-hero', className: 'reveal reveal-delay-2',
        style: { margin: '1.5rem auto 1.5rem', lineHeight: 0.95 }
      }, React.createElement('img', {
        src: ASSET('nixology-logo.png'), alt: 'Nixology',
        style: {
          display: 'block', width: 'min(82vw, 720px)', height: 'auto', margin: '0 auto',
          filter: 'drop-shadow(0 0 24px oklch(0.55 0.21 320 / 0.55)) drop-shadow(0 0 60px oklch(0.55 0.21 320 / 0.35))'
        }
      })),
      React.createElement('p', {
        className: 'reveal reveal-delay-3',
        style: {
          fontFamily: 'var(--font-serif)', fontStyle: 'italic', fontSize: 'clamp(1.25rem, 2.6vw, 1.9rem)',
          color: 'oklch(0.78 0.05 290)', maxWidth: '36rem', margin: '0 auto', lineHeight: 1.4
        }

      React.createElement('div', {

        React.createElement('svg', { width: 14, height: 22, viewBox: '0 0 14 22', fill: 'none', 'aria-hidden': true },

  /* ─────────────────────────── PROBLEM SLIDE ─────────────────────────── */

  const ProblemSlide = () => React.createElement(React.Fragment, null,
    React.createElement(SmokeLayer, { variant: 'purple', intensity: 0.6 }),
    React.createElement('div', {

        gap: '3rem', maxWidth: '80rem', width: '100%', alignItems: 'center'

  /* ─────────────────────────── PRODUCT SLIDE ─────────────────────────── */

  const ProductSlide = () => React.createElement(React.Fragment, null,

      }, 'Your cellar, ', React.createElement('em', { className: 'text-gradient-purple' }, 'conjured.')),
      React.createElement('div', { style: { position: 'relative', width: 'min(280px, 70vw)', margin: '0 auto' }, className: 'reveal reveal-delay-3' },
        React.createElement('div', {
          className: 'animate-glow-pulse',

        }, React.createElement('img', {

        })),
        React.createElement('img', {

          style: { position: 'absolute', top: '-20%', right: '-30%', width: '120px', opacity: 0.85, filter: 'drop-shadow(0 0 20px oklch(0.55 0.21 320 / 0.5))' }
        }),
